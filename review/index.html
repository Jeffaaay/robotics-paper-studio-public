<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Robotics Paper Studio · Review</title>
<style>
:root{color-scheme:dark;--bg:#111920;--panel:#19242c;--line:#2a3942;--ink:#eeeae2;--muted:#9caaaF;--mint:#a4cfbd;--orange:#e7b59a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}header,main{max-width:1160px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--mint);text-transform:uppercase}h1{font-size:28px;letter-spacing:-.02em;font-weight:550;margin:8px 0}h2{font-size:21px;font-weight:550;margin:0 0 10px}p{color:var(--muted);line-height:1.7;margin:8px 0}.pill{display:inline-block;font-size:12px;padding:7px 11px;border:1px solid var(--line);border-radius:30px;color:var(--mint)}.layout{display:grid;grid-template-columns:1fr 270px;gap:28px}.intro{margin-bottom:20px}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.variant{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden}.variant video{width:100%;max-height:510px;display:block;background:#101A24;object-fit:contain}.meta{padding:16px}.meta h3{font-size:16px;font-weight:500;margin:0 0 8px}.small{font-size:12px;line-height:1.6}.actions{display:grid;gap:8px;margin-top:14px}button,a.download{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;text-decoration:none;text-align:center;background:transparent;color:var(--ink)}button:hover,a.download:hover{border-color:var(--mint)}button.primary{background:var(--mint);color:#14231d;border-color:var(--mint);font-weight:600}button:disabled{opacity:.4;cursor:default}textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:13px;border-radius:8px;resize:vertical}details{margin:20px 0;border:1px solid var(--line);border-radius:12px;padding:16px}summary{cursor:pointer;font-size:14px}pre{white-space:pre-wrap;line-height:1.7;font-family:inherit;font-size:13px;color:var(--muted)}aside{border-left:1px solid var(--line);padding-left:24px}aside p{font-size:12px}.day{width:100%;text-align:left;display:flex;gap:10px;margin:7px 0;padding:10px;border-color:transparent}.day.active{background:var(--panel);border-color:var(--line)}.daynum{font-size:11px;color:var(--mint);min-width:28px;padding-top:2px}.daytitle{font-size:12px;line-height:1.5}.daystate{display:block;color:var(--muted);font-size:10px}.empty{padding:50px 25px;border:1px dashed var(--line);border-radius:15px}.notice{font-size:12px;color:var(--orange)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--mint);color:#14231d;padding:14px 24px;border-radius:10px;display:none;max-width:90%;z-index:5}.plan-foot{padding-top:10px}.subline{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.header-right{text-align:right}a{color:var(--mint)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--line);padding:24px 0}.variants{gap:12px}header,main{padding:20px}.variant video{max-height:450px}.header-right{display:none}}@media(max-width:480px){.variants{grid-template-columns:1fr}.variant video{max-height:560px}}
</style></head><body>
<header><div><div class="eyebrow">Robotics Paper Studio</div><h1>先看，再发。</h1><p class="small">少文字 · 先用动画讲清楚 · 每条由你决定</p></div><div class="header-right"><span class="pill">手动审核与发布</span><p class="small" id="counts">正在加载</p></div></header>
<main class="layout"><section><div id="current"></div><details><summary>从阅读到发布</summary><pre id="principles"></pre></details><p class="notice">批准只保存本地审核记录。视频或发布文案改变后，需要重新确认；这里不会向 Instagram 发布。</p></section><aside><h2>视频审核队列</h2><p>先选论文、写自己的笔记，再做成片。每条由你看过后决定。</p><div id="days"></div><p class="plan-foot">这里先保留之前的示意样片。每日选题与阅读进度记在 journal。</p></aside></main><div id="toast" role="status"></div>
<script>
let state,selected=1;
const el=(tag,cls,text)=>{let x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',5000)}
async function load(){const r=await fetch('/api/state',{cache:'no-store'});state=await r.json();render()}
async function decide(item,v,action,note=''){try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':state.review_token},body:JSON.stringify({item_id:item.id,variant_id:v.id,fingerprint:v.fingerprint,action,note})});const d=await r.json();if(!r.ok)throw new Error(d.error);toast(action==='approve'?'已记录：你批准了此版本，尚未发布。':action==='changes'?'修改意见已保存。':'已记录你手动完成发布。');await load()}catch(e){toast(e.message)}}
function render(){
 document.getElementById('counts').textContent=`${state.days.filter(d=>d.approval_current).length} 已批准 · ${state.days.filter(d=>d.publication).length} 已手动发布`;
 document.getElementById('principles').textContent=state.principles.join('\n\n');
 let nav=document.getElementById('days');nav.replaceChildren();for(const d of state.days){let b=el('button','day'+(selected===d.day?' active':''));b.append(el('span','daynum',String(d.day).padStart(2,'0')));let t=el('span','daytitle',d.title);t.append(el('span','daystate',d.status));b.append(t);b.onclick=()=>{selected=d.day;render()};nav.append(b)}
 let item=state.days.find(d=>d.day===selected)||state.days[0],box=document.getElementById('current');box.replaceChildren();
 let intro=el('div','intro');intro.append(el('div','eyebrow',`DRAFT ${String(item.day).padStart(2,'0')}`),el('h1','',item.title),el('p','',item.visual));
 let info=el('div','subline');info.append(el('span','pill',item.status),el('span','pill',item.duration),el('span','pill','无旁白'));intro.append(info);box.append(intro);
 let ready=(item.variants||[]).filter(v=>v.ready);if(!ready.length){let empty=el('div','empty');empty.append(el('h2','','待制作'),el('p','',item.evidence_requirement));box.append(empty)}
 else{let grid=el('div','variants');for(const v of ready){let card=el('article','variant'),video=el('video');video.controls=true;video.preload='metadata';video.playsInline=true;video.muted=true;if(v.cover_url)video.poster=v.cover_url;video.src=v.media_url+'?v='+v.fingerprint.slice(0,12);video.setAttribute('aria-label',v.label);card.append(video);let meta=el('div','meta');meta.append(el('h3','',v.label),el('p','small',v.description));let actions=el('div','actions');let dl=el('a','download','下载这一版');dl.href=v.media_url;dl.download=v.file.split('/').pop();actions.append(dl);let approve=el('button','primary','我看过，批准此版本');approve.onclick=()=>decide(item,v,'approve');actions.append(approve);let changes=el('button','','需要修改');let area=el('textarea');area.placeholder='想改哪里？例如动作更快、删除标签…';area.rows=2;area.hidden=true;changes.onclick=()=>{if(area.hidden){area.hidden=false;changes.textContent='保存修改意见';area.focus()}else decide(item,v,'changes',area.value)};actions.append(changes,area);if(item.approval_current&&item.decision.variant_id===v.id){let pub=el('button','','我已手动发布这一版');pub.onclick=()=>decide(item,v,'published');actions.append(pub)}meta.append(actions);card.append(meta);grid.append(card)}box.append(grid)}
 if(item.decision&&item.decision.note)box.append(el('p','notice','你的修改意见：'+item.decision.note));
 let caption=el('details'),summary=el('summary','','发布文案（也包含在本次审核里）');caption.append(summary,el('pre','',item.post_caption));let copy=el('button','','复制文案');copy.onclick=async()=>{try{await navigator.clipboard.writeText(item.post_caption);toast('文案已复制。')}catch(e){toast('请在上方文案中手动复制。')}};caption.append(copy);box.append(caption);
}
load().catch(e=>{document.getElementById('current').textContent='暂时无法加载本地计划：'+e.message});
</script></body></html>
